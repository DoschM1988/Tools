<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belegerfassung Maschinenring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ Grundgerüst ============ */
  :root {
    --green: #65b32e;        /* MR-Grün */
    --green-dark: #4a8a1f;
    --bg: #f6f8f4;
    --line: #dfe4da;
    --text: #26302a;
    --muted: #77827a;
    --danger: #B94A3B;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 28px 16px;
    color: var(--text);
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ============ Kopf ============ */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 44px; width: auto; display: block; }
  .brand h1 {
    font-size: 21px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand h1 span {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0;
  }

  /* ============ Buttons & Toolbar ============ */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
  .btn-secondary:hover { border-color: var(--green); }

  .mwst-toggle {
    display: flex;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }
  .mwst-toggle button {
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  .mwst-toggle button.active { background: var(--green); color: #fff; }

  /* ============ Beleg-Karten ============ */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .beleg-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .del {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .del:hover { background: #fdeceb; }

  /* ============ Formular-Grid ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.span2 { grid-column: span 2; }
  .field.span4 { grid-column: span 4; }
  label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  input, textarea {
    font-family: inherit;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    width: 100%;
  }
  select {
    font-family: inherit;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    width: 100%;
    min-width: 0;
  }
  select:focus { outline: none; border-color: var(--green); background: #fff; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 44px; }

  /* iOS Safari: date-Inputs brauchen appearance-Reset, sonst sprengen sie die Feldbreite */
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    min-width: 0;
    max-width: 100%;
    min-height: 40px;
    text-align: left;
  }
  input[type="date"]::-webkit-date-and-time-value {
    text-align: left;
    margin: 0;
  }
  .num { text-align: right; }
  .check-field {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    align-self: end;
    padding-bottom: 8px;
  }
  input[type=checkbox] {
    width: 18px; height: 18px;
    accent-color: var(--green);
    cursor: pointer;
    flex: none;
  }
  .check-field label {
    text-transform: none;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0;
    cursor: pointer;
  }

  /* ============ Summen ============ */
  .summary {
    display: flex;
    justify-content: flex-end;
    gap: 32px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 6px;
  }
  .sum-block { text-align: right; }
  .sum-block .label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 2px; }
  .sum-block .value { font-size: 19px; font-weight: 800; }
  .sum-block .value.main { font-size: 22px; color: var(--green-dark); }

  /* ============ Leerer Zustand ============ */
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 40px 0;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
  }

  /* ============ Senden-Box ============ */
  .send-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-top: 14px;
  }
  .send-box h2 { font-size: 14px; font-weight: 800; margin: 0 0 10px; }
  #summaryList { font-size: 13px; margin: 0 0 14px; padding: 0; list-style: none; }
  #summaryList li {
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  #summaryList li:last-child { border-bottom: none; }
  #summaryList .s-desc { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #summaryList .s-price { font-weight: 700; white-space: nowrap; }
  .send-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .send-row .to { font-size: 12.5px; color: var(--muted); }
  .send-row .to b { color: var(--text); }

  input.invalid, textarea.invalid {
    border-color: var(--danger);
    background: #fdeceb;
  }
  input.price-off {
    background: #eef0ec;
    color: var(--muted);
    cursor: not-allowed;
  }
  input[readonly] {
    background: #eef0ec;
    color: var(--muted);
  }

  /* Such-Combobox für MR-Leistung */
  .mr-inbox { position: relative; }
  .mrresults {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--green);
    border-radius: 8px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 30;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }
  .mritem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    font-size: 13.5px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .mritem:last-child { border-bottom: none; }
  .mritem:hover { background: #eef5e6; }
  .mritem small { color: var(--muted); font-weight: 500; }
  .mritem b { color: var(--green-dark); white-space: nowrap; }
  .mritem.muted { color: var(--muted); cursor: default; justify-content: flex-start; }
  .mrhead {
    position: sticky;
    top: 0;
    background: #eef5e6;
    color: var(--green-dark);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 11px;
    border-bottom: 1px solid var(--line);
  }
  .field-err {
    font-size: 11px;
    font-weight: 600;
    color: var(--danger);
    margin-top: 3px;
    display: none;
    text-transform: none;
    letter-spacing: 0;
    white-space: normal;
  }
  .field-err.show { display: block; }

  .btn-clear {
    font-family: inherit;
    width: 100%;
    margin-top: 12px;
    padding: 12px 18px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    color: var(--muted);
    border: 1.5px solid var(--line);
  }
  .btn-clear:hover { border-color: var(--danger); color: var(--danger); }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 28px;
    padding-top: 8px;
  }
  .footer img { height: 26px; width: auto; opacity: 0.85; }
  .footer span { font-size: 11.5px; color: var(--muted); }

  /* ============ Mobil ============ */
  @media (max-width: 820px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field.span4 { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    body { padding: 16px 12px; }
    .head { flex-direction: column; align-items: stretch; }
    .brand { justify-content: flex-start; }
    .brand img { height: 36px; }
    .toolbar > button { flex: 1; }
    .mwst-toggle { width: 100%; }
    .mwst-toggle button { flex: 1; }
    .card { padding: 16px 14px 14px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .field.span2, .field.span4 { grid-column: span 1; }
    .check-field { align-self: start; padding-bottom: 0; }
    .summary { flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; }
    .sum-block { text-align: left; }
    .send-row { flex-direction: column; align-items: stretch; }
    .send-row button { width: 100%; }
    input, textarea { font-size: 16px; } /* verhindert iOS-Auto-Zoom */
  }
</style>
</head>

/* ============ Zustand ============ */
let uidCounter = 0;          // eindeutige IDs für Checkbox-Labels

/* ============ Hilfsfunktionen ============ */
const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function fmtEUR(v) {
  return (parseFloat(v) || 0).toLocaleString('de-DE', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  }) + ' €';
}

/* Liest alle Werte eines Belegs aus */
function readCard(card, i) {
  const selbstpreis = card.querySelector('.selbstpreis').checked;
  const mrindex = card.dataset.mrindex ?? '';
  const leistung = (mrindex !== '' && PREISE[mrindex]) ? PREISE[mrindex].n : '';
  return {
    nr: i + 1,
    ag: card.querySelector('.ag').value,
    an: card.querySelector('.an').value,
    datum: card.querySelector('.datum').value,
    vskz: card.querySelector('.vskz').value,
    leistung,
    freitext: card.querySelector('.freitext').value,
    umfang: card.querySelector('.umfang').value,
    selbstpreis,
    mrindex,
    dieselwahl: card.dataset.dieselwahl || '',
    einzelpreis: card.querySelector('.einzelpreis').value,
    gesamtpreis: parseFloat(card.querySelector('.gesamtpreis').value) || 0,
    agtank: card.querySelector('.agtank').checked,
    bemerkung: card.querySelector('.bemerkung').value
  };
}

/* Preisfelder je nach „Preis selbst festlegen" sperren/freigeben */
function togglePreis(cb, skipSave) {
  const card = cb.closest('.card');
  const on = cb.checked;
  ['.einzelpreis', '.gesamtpreis'].forEach(sel => {
    const inp = card.querySelector(sel);
    inp.disabled = !on;
    inp.classList.toggle('price-off', !on);
    inp.placeholder = on ? '0,00' : 'MR-Preis';
  });
  if (!on) {
    // Maschinenringpreis: aus Liste füllen, falls gewählt – sonst leeren
    if (card.dataset.mrindex != null && card.dataset.mrindex !== '') {
      applyMrPrice(card);
    } else {
      card.querySelector('.einzelpreis').value = '';
      card.querySelector('.gesamtpreis').value = '';
    }
  }
  updateDieselToggle(card);
  if (!skipSave) refresh();
}

/* ============ MR-Preisliste (Suche) ============ */
function renderResults(card, query) {
  const box = card.querySelector('.mrresults');
  const q = (query || '').trim().toLowerCase();
  let list = PREISE.map((it, i) => ({ it, i }));
  if (q) {
    const terms = q.split(/\s+/);
    list = list.filter(({ it }) => {
      const hay = (it.v + ' ' + it.n + ' ' + it.k).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  list = list.slice(0, 50);
  if (!list.length) {
    box.innerHTML = '<div class="mritem muted">Keine Treffer – nutze das Freitext-Feld</div>';
  } else {
    let html = '';
    let lastKat = null;
    list.forEach(({ it, i }) => {
      if (it.k !== lastKat) {
        html += `<div class="mrhead">${it.k}</div>`;
        lastKat = it.k;
      }
      const preis = it.d != null ? fmtEUR(it.d) : (it.o != null ? fmtEUR(it.o) : '');
      html += `<div class="mritem" onclick="mrPick(this.closest('.card'), ${i})">`
            + `<span>${it.v} · ${it.n} <small>(${it.e})</small></span><b>${preis}</b></div>`;
    });
    box.innerHTML = html;
  }
  box.style.display = 'block';
}

function mrOpen(input) {
  renderResults(input.closest('.card'), input.value);
}

function mrType(input) {
  const card = input.closest('.card');
  // Tippen = Auswahl aufheben
  if (card.dataset.mrindex != null) {
    delete card.dataset.mrindex;
    card.querySelector('.vskz').value = '';
    if (!card.querySelector('.selbstpreis').checked) {
      card.querySelector('.einzelpreis').value = '';
      card.querySelector('.gesamtpreis').value = '';
    }
    updateDieselToggle(card);
  }
  renderResults(card, input.value);
  refresh();
}

function mrPick(card, i) {
  const it = PREISE[i];
  card.dataset.mrindex = i;
  card.querySelector('.mrsearch').value = it.v + ' · ' + it.n;
  card.querySelector('.vskz').value = it.v;
  card.dataset.dieselwahl = (it.d != null) ? 'diesel' : 'ohne';
  card.querySelector('.mrresults').style.display = 'none';
  updateDieselToggle(card);
  applyMrPrice(card);
}

function setDiesel(btn, wahl) {
  const card = btn.closest('.card');
  card.dataset.dieselwahl = wahl;
  updateDieselToggle(card);
  applyMrPrice(card);
}

function updateDieselToggle(card) {
  const df = card.querySelector('.diesel-field');
  const i = card.dataset.mrindex;
  const self = card.querySelector('.selbstpreis').checked;
  if (i == null || i === '' || self) { df.style.display = 'none'; return; }
  const it = PREISE[i];
  const both = it.d != null && it.o != null;
  df.style.display = both ? '' : 'none';
  const wahl = card.dataset.dieselwahl || (it.d != null ? 'diesel' : 'ohne');
  card.querySelector('.d-mit').classList.toggle('active', wahl === 'diesel');
  card.querySelector('.d-ohne').classList.toggle('active', wahl === 'ohne');
  card.querySelector('.d-mit').textContent = 'mit Diesel' + (it.d != null ? ` (${fmtEUR(it.d)})` : '');
  card.querySelector('.d-ohne').textContent = 'ohne Diesel' + (it.o != null ? ` (${fmtEUR(it.o)})` : '');
}

function applyMrPrice(card) {
  if (card.querySelector('.selbstpreis').checked) return;
  const i = card.dataset.mrindex;
  if (i == null || i === '') return;
  const it = PREISE[i];
  const wahl = card.dataset.dieselwahl || (it.d != null ? 'diesel' : 'ohne');
  const price = wahl === 'diesel' ? it.d : it.o;
  if (price != null) {
    card.querySelector('.einzelpreis').value = price.toFixed(2);
    const umfang = parseFloat(card.querySelector('.umfang').value) || 0;
    card.querySelector('.gesamtpreis').value = umfang ? (umfang * price).toFixed(2) : '';
  }
  refresh();
}

/* ============ Belege anlegen / löschen ============ */

  uidCounter++;
  const nr = $$('.card').length + 1;
  const card = document.createElement('div');
  card.className = 'card';

      </div>
      <div class="field">
        <label>Gesamtpreis (Netto) €</label>
        <input type="number" step="0.01" min="0" class="gesamtpreis num" oninput="calcBack(this)" placeholder="MR-Preis" disabled>
      </div>
      <div class="field check-field">
        <input type="checkbox" class="agtank" id="agtank-${uidCounter}" onchange="saveState()">

      <div class="field span4">

        <textarea class="bemerkung" placeholder="Zusätzliche Hinweise ..." oninput="saveState()"></textarea>

  if (data) {
    card.querySelector('.ag').value = data.ag || '';

    card.querySelector('.datum').value = data.datum || '';
    card.querySelector('.umfang').value = data.umfang || '';
    card.querySelector('.freitext').value = data.freitext || '';
    card.querySelector('.einzelpreis').value = data.einzelpreis || '';
    card.querySelector('.gesamtpreis').value = (data.gesamtpreis ? data.gesamtpreis : '') || '';
    card.querySelector('.agtank').checked = !!data.agtank;
    card.querySelector('.selbstpreis').checked = !!data.selbstpreis;

function delCard(btn) {
  btn.closest('.card').remove();
  renumber();
  refresh();
}

function renumber() {
  $$('.card .beleg-nr').forEach((el, i) => el.textContent = i + 1);
}

/* ============ Preisberechnung ============ */
function calc(el) {
  const card = el.closest('.card');
  const umfang = parseFloat(card.querySelector('.umfang').value) || 0;
  const einzel = parseFloat(card.querySelector('.einzelpreis').value) || 0;
  if (umfang && einzel) {
    card.querySelector('.gesamtpreis').value = (umfang * einzel).toFixed(2);
  }
  refresh();
}

function calcBack(el) {
  const card = el.closest('.card');
  const umfang = parseFloat(card.querySelector('.umfang').value) || 0;
  const gesamt = parseFloat(card.querySelector('.gesamtpreis').value) || 0;
  if (umfang && gesamt) {
    card.querySelector('.einzelpreis').value = (gesamt / umfang).toFixed(2);
  }
  refresh();
}

/* ============ Anzeige aktualisieren ============ */
function refresh() {
  const cards = $$('.card');
  $('#emptyState').style.display = cards.length ? 'none' : 'block';

  let sum = 0;
  cards.forEach(c => sum += parseFloat(c.querySelector('.gesamtpreis').value) || 0);
  $('#nettosumme').textContent = fmtEUR(sum);

  const list = $('#summaryList');
  list.innerHTML = '';
  cards.forEach((card, i) => {
    const b = readCard(card, i);
    const bez = b.leistung || b.freitext || '–';
    const preisText = b.selbstpreis ? fmtEUR(b.gesamtpreis) : (b.gesamtpreis ? fmtEUR(b.gesamtpreis) : 'MR-Preis');
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="s-desc">#${b.nr} · ${b.ag || '–'} → ${b.an || '–'} · ${bez}</span>` +
      `<span class="s-price">${preisText}</span>`;
    list.appendChild(li);
  });

  saveState();
}

/* ============ Validierung ============ */
function validate() {
  let ok = true;
  let firstBad = null;
  $$('.card').forEach(card => {
    const ag = card.querySelector('.ag');
    const an = card.querySelector('.an');
    const datum = card.querySelector('.datum');
    const mrsearch = card.querySelector('.mrsearch');
    const freitext = card.querySelector('.freitext');
    const umfang = card.querySelector('.umfang');

    const setBad = (el, errSel, bad) => {
      el.classList.toggle('invalid', bad);
      const e = card.querySelector(errSel);
      if (e) e.classList.toggle('show', bad);
      if (bad && !firstBad) firstBad = el;
      if (bad) ok = false;
    };

    setBad(ag, '.err-ag', !ag.value.trim());
    setBad(an, '.err-an', !an.value.trim());
    setBad(datum, '.err-datum', !datum.value);

    // Leistung: MR-Auswahl ODER Freitext, plus Umfang
    const hatLeistung = (card.dataset.mrindex != null && card.dataset.mrindex !== '') || !!freitext.value.trim();
    const leistungOk = hatLeistung && !!umfang.value.trim();
    mrsearch.classList.toggle('invalid', !leistungOk && !hatLeistung);
    umfang.classList.toggle('invalid', !leistungOk && !umfang.value.trim());
    const le = card.querySelector('.err-leistung');
    if (le) le.classList.toggle('show', !leistungOk);
    if (!leistungOk) { ok = false; if (!firstBad) firstBad = hatLeistung ? umfang : mrsearch; }
  });

  if (firstBad) firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return ok;
}

/* ============ E-Mail-Versand ============ */
function sendMail() {
  const cards = $$('.card');
  if (!cards.length) { alert('Es sind noch keine Belege erfasst.'); return; }
  if (!validate()) return;

  let body = `Belegübersicht Maschinenring\n\n`;
  let sum = 0;

  cards.forEach((card, i) => {
    const b = readCard(card, i);
    sum += b.gesamtpreis;
    let preisHerkunft;
    if (b.selbstpreis) {
      preisHerkunft = `Preis: selbst festgelegt`;
    } else if (b.mrindex !== '' && b.mrindex != null) {
      const dv = b.dieselwahl === 'diesel' ? 'mit Diesel' : (b.dieselwahl === 'ohne' ? 'ohne Diesel' : '');
      preisHerkunft = `Preis: Maschinenringpreis${dv ? ' (' + dv + ')' : ''}`;
    } else {
      preisHerkunft = `Preis: Maschinenringpreis (durch MR)`;
    }
    body += `Beleg Nr. ${b.nr}\n`
          + `Auftraggeber (AG): ${b.ag || '-'}\n`
          + `Auftragnehmer (AN): ${b.an || '-'}\n`
          + `Leistungsdatum: ${b.datum || '-'}\n`
          + `VSKZ-Nr.: ${b.vskz || '-'}\n`
          + `Leistung: ${b.leistung || '-'}\n`
          + `Freitext: ${b.freitext || '-'}\n`
          + `Umfang: ${b.umfang || '-'}\n`
          + `${preisHerkunft}\n`
          + `Einzelpreis (Netto): ${b.einzelpreis ? fmtEUR(b.einzelpreis) : '-'}\n`
          + `Gesamtpreis (Netto): ${b.gesamtpreis ? fmtEUR(b.gesamtpreis) : '-'}\n`
          + `AG getankt: ${b.agtank ? 'ja' : 'nein'}\n`
          + `Bemerkung: ${b.bemerkung || '-'}\n\n`;
  });

  body += `Netto gesamt: ${fmtEUR(sum)}\n`
        + `(MR-Preise sind Netto-Richtpreise laut Verrechnungssätzen 2025.)\n`;

  const subject = encodeURIComponent('Belegübersicht Maschinenring');
  window.location.href = `mailto:${MAIL_TO}?subject=${subject}&body=${encodeURIComponent(body)}`;

  // Nach dem Versand Maske automatisch leeren
  resetAll();
}

/* ============ CSV-Export ============ */
function exportCSV() {
  const cards = $$('.card');
  const rows = [[
    'Beleg-Nr','Auftraggeber (AG)','Auftragnehmer (AN)','Leistungsdatum','VSKZ-Nr',
    'Leistung','Freitext','Umfang','Preisart','Einzelpreis (Netto)','Gesamtpreis (Netto)','AG getankt','Bemerkung'
  ]];

  let sum = 0;
  cards.forEach((card, i) => {
    const b = readCard(card, i);
    sum += b.gesamtpreis;
    let preisart;
    if (b.selbstpreis) preisart = 'selbst';
    else if (b.mrindex !== '' && b.mrindex != null)
      preisart = 'MR-Preis' + (b.dieselwahl === 'diesel' ? ' mit Diesel' : (b.dieselwahl === 'ohne' ? ' ohne Diesel' : ''));
    else preisart = 'Maschinenringpreis';
    rows.push([b.nr, b.ag, b.an, b.datum, b.vskz, b.leistung, b.freitext, b.umfang, preisart,
               b.einzelpreis, b.gesamtpreis, b.agtank ? 'ja' : 'nein', b.bemerkung]);
  });

  rows.push([]);
  rows.push(['','','','','','','','','','','Netto gesamt', fmtEUR(sum)]);

  const csv = rows.map(r =>
    r.map(v => `"${(v ?? '').toString().replace(/"/g, '""')}"`).join(';')
  ).join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'belege.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

/* ============ Speichern / Wiederherstellen (localStorage) ============ */
const STORAGE_KEY = 'mrBelegerfassung';
let restoring = false;

function saveState() {
  if (restoring) return;
  try {
    const belege = $$('.card').map((card, i) => readCard(card, i));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ belege }));
  } catch (e) { /* Speicher nicht verfügbar */ }
}

function restoreState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    restoring = true;
    $('#list').innerHTML = '';
    uidCounter = 0;
    if (Array.isArray(s.belege) && s.belege.length) {
      s.belege.forEach(b => addBeleg(b));
    } else {
      addBeleg();
    }
    restoring = false;
    refresh();
    return true;
  } catch (e) {
    restoring = false;
    return false;
  }
}

/* ============ Zurücksetzen ============ */
function resetAll() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  $('#list').innerHTML = '';
  uidCounter = 0;
  document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
  document.querySelectorAll('.field-err.show').forEach(e => e.classList.remove('show'));
  addBeleg();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function leeren() {
  if (!confirm('Alle Belege wirklich löschen?')) return;
  resetAll();
}

/* Suchergebnisse schließen, wenn außerhalb geklickt wird */
document.addEventListener('click', e => {
  if (!e.target.closest('.mr-search-wrap')) {
    $$('.mrresults').forEach(r => r.style.display = 'none');
  }
});

/* ============ Start ============ */
if (!restoreState()) addBeleg();
</script>
